# The Cactarium stack et/et-stack: the official Einstein Toolkit releases. The name avoids a
# clash with a package of the same name under et.
#
# The branch master follows the official manifest's master
# (https://bitbucket.org/einsteintoolkit/manifest.git): einsteintoolkit.th here is that branch's
# thornlist, byte for byte, which names no release branches, so every repo is at its default
# branch. et/et-stack@head and @master therefore behave like `cactup install master`. Nothing is
# pinned on master, and master is never tagged.
#
# Releases come only from tags, each on a commit that carries that release's thornlist and
# pin-tag: the ET release ET_YYYY_MM_vN is version YYYY.M.N on the default track, cut by the git
# tag vYYYY.M.N (ET_2026_05_v0 is v2026.5.0). To cut the next one: commit the manifest's
# einsteintoolkit.th at the release's tag with `pin-tag = "ET_YYYY_MM_vN"` and a [[stack.pin]]
# for every repo that lacks that tag, tag that commit, then restore the manifest's master here.
format = 1

[stack]
name = "et-stack"
owners = ["et"]
description = """
The Einstein Toolkit, as the official manifest defines it: every release, ET_2026_05 (2026.5.0) onward.

Each release builds every thorn of that Einstein Toolkit release, with every repo pinned at its \
release tag. For a smaller build, see et/carpet-stack and et/carpetx-stack.
"""
contact = "https://github.com/EinsteinToolkit/tickets/issues"
thornlist = "einsteintoolkit.th"
